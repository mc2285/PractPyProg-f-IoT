<!-- chapter03/templates/index_ws_client.html -->
<!DOCTYPE html>
<html>

<head>
    <title>Flask Web Socket Example</title>
    <script src="/static/jquery.min.js"></script>
    <script src="/static/socket.io.js"></script> <!-- (1) -->
    <script type="text/javascript">
        var socket = io();
        var sendTimer = null;
        var lastLevel = null;
        var SEND_DELAY = 100; // ms

        socket.on('connect', function () {
            console.log("Connected to Server");
            $("#connected").html("Yes");
        });

        socket.on('disconnect', function () {
            console.log("Disconnected from the Server");
            $("#connected").html("No");
        });

        socket.on('led', function (dataFromServer) {
            console.log(dataFromServer);
            if (dataFromServer.level !== undefined) {
                $("input[type=range].brightnessLevel").val(dataFromServer.level);
                $("#brightnessLevel").html(dataFromServer.level);
            }
        });

        function sendLevel() {
            if (lastLevel !== null) {
                socket.emit('led', { level: lastLevel });
            }
            sendTimer = null;
        }

        $(document).ready(function () {
            $("input[type=range].brightnessLevel").on('input', function () {
                lastLevel = $(this).val();
                $("#brightnessLevel").html(lastLevel);

                if (sendTimer) {
                    clearTimeout(sendTimer);
                }
                sendTimer = setTimeout(sendLevel, SEND_DELAY);
            });

            // Ensure final value is sent immediately when user releases
            $("input[type=range].brightnessLevel").on('change', function () {
                lastLevel = $(this).val();
                $("#brightnessLevel").html(lastLevel);

                if (sendTimer) {
                    clearTimeout(sendTimer);
                    sendTimer = null;
                }
                socket.emit('led', { level: lastLevel });
            });
        });
    </script>
</head>

<body>
    <h1>Flask Web Socket Example</h1>
    LED is connected to GPIO {{pin}}<br>
    Connected to server: <span id="connected">No</span> <!-- (7) -->
    <br><br>
    Brightness <span id="brightnessLevel"></span>:<br>
    <input type="range" min="0" max="100" value="0" class="brightnessLevel">
</body>

</html>
